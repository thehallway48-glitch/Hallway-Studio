# ============================================================================
#  HallwayLauncher Studio — build the Windows .exe installer on GitHub
#  You don't need a Windows machine. GitHub borrows one for ~4 minutes.
# ===========================================================================

name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build .exe on Windows
    runs-on: windows-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install all the libraries the project needs.
      # npm v11 blocks postinstall scripts by default, so we explicitly allow
      # the ones we need (electron downloads its binary, esbuild its engine).
      - name: Install dependencies
        env:
          # Let electron's postinstall fetch its Windows binary.
          npm_config_allow_scripts: 'true'
        run: npm install --no-fund --no-audit

      - name: Build the Squirrel.Windows installer
        run: npm run make:squirrel

      - name: Show generated artifacts
        shell: pwsh
        run: |
          Write-Host "=== Artifacts in out/make/squirrel.win32/x64 ==="
          Get-ChildItem -Recurse out/make/squirrel.win32/x64 | Select-Object FullName, Length

      - name: Upload the .exe installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HallwayLauncherStudio-windows-exe
          path: out/make/squirrel.win32/x64/
          if-no-files-found: error
          retention-days: 30
